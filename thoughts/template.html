<!DOCTYPE html>
<!-- Generated by thoughts/build.py from {{source}} - edit the markdown, not this file. -->
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <link rel="stylesheet" href="/main.css">
  <link rel="stylesheet" href="/thoughts/post.css">
{{head}}
  <script src="/static/js/starfield.js"></script>
  <script src="/static/js/navigation.js"></script>
  <script src="/static/js/utils.js"></script>
</head>

<body>
  <div class="main">
    <a href="/thoughts/index.html" class="nav-link" aria-label="Back to thoughts"><div id="sun"></div></a>
    <article class="post">
      <header class="post-header">
        <h1 class="title">{{title}}</h1>
        <time class="date" datetime="{{iso_date}}">{{date}}</time>
      </header>

{{content}}

      <a href="/thoughts/index.html" class="nav-link post-end" aria-label="Back to thoughts"></a>
    </article>
  </div>

  <script>
    // In-page links (footnotes) scroll without adding a history entry, which the SPA router would misread
    if (!window._postAnchorHandler) {
      window._postAnchorHandler = true;
      document.addEventListener('click', (e) => {
        const link = e.target.closest('.post a[href^="#"]');
        if (!link) return;
        const target = document.getElementById(decodeURIComponent(link.getAttribute('href').slice(1)));
        if (!target) return;
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    }
  </script>
</body>

</html>
