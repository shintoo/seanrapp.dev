<!DOCTYPE html>

<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/main.css">
  <link rel="stylesheet" href="budd-e.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="../static/js/navigation.js"></script>
  <script src="../static/js/starfield.js"></script>
  <script src="../static/js/utils.js"></script>
  <style>
    .main {
      max-width: 90vw !important;
    }

    .solar-system {
      position: relative;
      width: 100%;
      height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .solar-system svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .central-star {
      position: absolute;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 12px 4px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      z-index: 2;
      text-decoration: none;
    }

    .planet {
      position: absolute;
      border-radius: 50%;
      background: white;
      cursor: pointer;
      display: block;
      pointer-events: auto;
      z-index: 2;
    }

    .planet .tooltip {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(100% + 8px);
      color: white;
      font-family: monospace;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      border: 1px solid white;
      padding: 8px;
    }

    .planet:hover .tooltip {
      opacity: 1;
    }

    .planet:hover {
      box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.5);
    }

    @media (max-width: 768px) {
      .article-modal {
        width: 95vw;
        height: 95vh;
        padding: 40px 16px 16px;
      }
    }

  </style>
</head>

<body>
  <div class="main">
    <div class="solar-system" id="solar-system">
      <svg id="orbit-paths"></svg>
      <a href="/index.html" class="central-star nav-link"></a>
      <a class="planet" style="background-color: #82a7a2" id="planet-0"><span class="tooltip">BUDD-E: An emotional robot</span></a>
      <a class="planet" style="background-color: #efcabe" id="planet-1"><span class="tooltip">Stereoscopy and other visual curiosities</span></a>
      <!-- <a class="planet" style="background-color: #8aaf9c" id="planet-2"><span class="tooltip">Your greatest impact</span></a> -->
      <!-- <a class="planet" id="planet-3"><span class="tooltip">Not alone in the universe, but lonely</span></a> -->
    </div>
  </div>

  <script>
    var _solarSystemAnimationId = null;

    function initSolarSystem() {
      // Cancel any previous animation loop
      if (_solarSystemAnimationId) {
        cancelAnimationFrame(_solarSystemAnimationId);
        _solarSystemAnimationId = null;
      }

      const container = document.getElementById('solar-system');
      if (!container) return;

      const ORBIT_SPEED_MULTIPLIER = 0.05;

      const articles = [
        {
          id: 'planet-0',
          title: 'BUDD-E: An emotional robot',
          href: '/thoughts/budd-e.html',
          size: 10,
          semiMajorAxis: 0.20,
          semiMinorAxis: 0.08,
          speed: 0.3,
          startAngle: Math.PI * Math.random() * 2
        },
        {
          id: 'planet-1',
          title: 'Stereoscopy and other visual curiosities',
          href: '/thoughts/stereo.html',
          size: 14,
          semiMajorAxis: 0.35,
          semiMinorAxis: 0.13,
          speed: 0.2,
          startAngle: Math.PI * Math.random() * 2,
        },
        {
          id: 'planet-2',
          hidden: true,
          title: 'Your greatest impact',
          href: '/thoughts/your-greatest-impact.html',
          size: 18,
          semiMajorAxis: 0.45,
          semiMinorAxis: 0.2,
          speed: 0.2,
          startAngle: Math.PI * Math.random() * 2,
        }
      ];

      const svg = document.getElementById('orbit-paths');

      if (!svg) return;

      const angles = articles.map(a => a.startAngle);

      function drawOrbits() {
        const w = container.offsetWidth;
        const h = container.offsetHeight;
        const cx = w / 2;
        const cy = h / 2;

        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        svg.innerHTML = '';

        articles.forEach(article => {
          if (article.hidden) {
            return;
          }
          const a = article.semiMajorAxis * w;
          const b = article.semiMinorAxis * h;
          const ellipse = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
          ellipse.setAttribute('cx', cx);
          ellipse.setAttribute('cy', cy);
          ellipse.setAttribute('rx', a);
          ellipse.setAttribute('ry', b);
          ellipse.setAttribute('fill', 'none');
          ellipse.setAttribute('stroke', 'gray');
          ellipse.setAttribute('stroke-width', '1');
          svg.appendChild(ellipse);
        });
      }

      function updatePlanets() {
        // Stop if container was removed from DOM (SPA navigated away)
        if (!document.contains(container)) {
          _solarSystemAnimationId = null;
          return;
        }

        const w = container.offsetWidth;
        const h = container.offsetHeight;
        const cx = w / 2;
        const cy = h / 2;

        articles.forEach((article, i) => {
          const el = document.getElementById(article.id);
          if (!el) return;
          const a = article.semiMajorAxis * w;
          const b = article.semiMinorAxis * h;

          angles[i] += article.speed * ORBIT_SPEED_MULTIPLIER * (1 / 60);

          const x = cx + a * Math.cos(angles[i]) - article.size / 2;
          const y = cy + b * Math.sin(angles[i]) - article.size / 2;

          el.style.width = article.size + 'px';
          el.style.height = article.size + 'px';
          el.style.left = x + 'px';
          el.style.top = y + 'px';
        });

        _solarSystemAnimationId = requestAnimationFrame(updatePlanets);
      }

      // Planet click handlers
      articles.forEach(article => {
        const el = document.getElementById(article.id);
        if (!el) return;
        el.addEventListener('click', (e) => {
          e.preventDefault();
          history.pushState({ url: article.href }, '', article.href);
          loadPage(article.href);
        });
      });

      // Init
      drawOrbits();
      _solarSystemAnimationId = requestAnimationFrame(updatePlanets);

      window.addEventListener('resize', drawOrbits);
    }

    // Run on initial page load
    initSolarSystem();
  </script>
</body>

</html>
