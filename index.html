<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/main.css">
  <script src="../static/js/navigation.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
    }

    .star-link {
      position: fixed;
      border-radius: 50%;
      background: white;
      cursor: pointer;
      display: block;
      pointer-events: auto;
      z-index: 10000;
      box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.5);
      transition: box-shadow 0.8s ease;
    }

    .star-link .tooltip {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(100% + 8px);
      color: white;
      font-family: monospace;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      border: 1px solid white;
      padding: 8px;
    }

    .star-link:hover .tooltip {
      opacity: 1;
    }

    .star-link:hover {
      box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.75);
    }
  </style>

</head>

<body>
  <div class="starfield" id="starfield">
  </div>
  <div class="main"></div>

  <a class="star-link" href="/about.html" id="star-about">
    <span class="tooltip">about</span>
  </a>
  <a class="star-link nav-link" href="/thoughts/index.html" id="star-thoughts">
    <span class="tooltip">thoughts</span>
  </a>
  <a class="star-link" href="/adventures/index.html" id="star-adventures">
    <span class="tooltip">adventures</span>
  </a>

  <script src="/static/js/starfield.js"></script>
  <script>
    // Real coordinates of the Summer Triangle stars
    const SUMMER_TRIANGLE = {
      'star-adventures':      { ra: 279.2347, dec: 38.7837, size: 12, label: 'Vega' },       // Vega
      'star-about':   { ra: 310.3580, dec: 45.2803, size: 10, label: 'Deneb' },      // Deneb
      'star-thoughts': { ra: 297.6958, dec:  8.8683, size: 11, label: 'Altair' },      // Altair
    };

    function positionStarLinks() {
      if (!window.gaiaProject) return;

      Object.entries(SUMMER_TRIANGLE).forEach(([id, star]) => {
        const el = document.getElementById(id);
        if (!el) return;

        const p = window.gaiaProject(star.ra, star.dec);
        if (!p) return;

        el.style.width = star.size + 'px';
        el.style.height = star.size + 'px';
        // Center the element on the projected point
        el.style.left = (p.px - star.size / 2) + 'px';
        el.style.top  = (p.py - star.size / 2) + 'px';
      });
    }

    // Position once the starfield projection is ready
    window.addEventListener('starfield-ready', positionStarLinks);
    window.addEventListener('resize', positionStarLinks);
    // Also try immediately in case starfield loaded first
    positionStarLinks();
  </script>
</body>

</html>
