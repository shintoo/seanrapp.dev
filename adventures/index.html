<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>adventures</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --white: #e8e4df;
    --white-dim: rgba(232, 228, 223, 0.4);
    --white-faint: rgba(232, 228, 223, 0.08);
    --accent: #e8e4df;
  }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: grab;
  }

  body:active { cursor: grabbing; }

  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 1;
    touch-action: none;
  }
  canvas { display: block; }

  /* Tooltip on hover */
  #hover-label {
    position: fixed;
    z-index: 10;
    pointer-events: none;
    font-family: monospace;
    font-size: 1rem;
    padding: 6px 14px;
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
    border: 1px solid white;
    background: black;
  }

  #hover-label.visible { opacity: 1; }

  .year {
    opacity: 0.5;
  }

  /* Modal overlay */
  #modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  #modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  #modal {
    background: black;
    border: 1px solid white;
    max-width: 680px;
    width: 92vw;
    max-height: 85vh;
    overflow-y: auto;
    transform: translateY(20px) scale(0.97);
    transition: transform 0.35s ease;
    scrollbar-width: thin;
    scrollbar-color: rgba(232,228,223,0.15) transparent;
  }

  #modal-overlay.open #modal {
    transform: translateY(0) scale(1);
  }

  #modal-close {
    position: sticky;
    top: 0;
    float: right;
    z-index: 5;
    margin: 16px 16px 0 0; 
    color: white;
    background: black;
    width: 36px;
    height: 36px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
  }

  #modal-title {
    font-family: monospace;
    font-size: 1rem;
    font-weight: 400;
    padding: 40px 36px 8px;
    line-height: 1.2;
  }

  #modal-gallery {
    display: flex;
    gap: 8px;
    padding: 20px 36px 12px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }

  #modal-gallery::-webkit-scrollbar { display: none; }

  #modal-gallery img {
    height: 220px;
    min-width: 160px;
    object-fit: cover;
    border-radius: 4px;
    scroll-snap-align: start;
    flex-shrink: 0;
    border: 1px solid var(--white-faint);
  }

  #modal-description {
    padding: 20px 36px 36px;
    font-size: 0.95rem;
    font-weight: 300;
    line-height: 1.7;
    color: rgba(232,228,223,0.8);
  }

  #modal-description a {
    color: var(--white);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* Subtle page title */
  #page-title {
    position: fixed;
    top: 28px;
    left: 36px;
    z-index: 5;
    font-family: 'Instrument Serif', serif;
    font-size: 1.3rem;
    letter-spacing: 0.02em;
    color: var(--white-dim);
    pointer-events: none;
  }

  /* Subtle instructions */
  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-size: 0.75rem;
    color: rgba(232,228,223,0.25);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div id="hover-label"></div>
<div id="modal-overlay">
  <div id="modal">
    <button id="modal-close">×</button>
    <div id="modal-title"></div>
    <div id="modal-gallery"></div>
    <div id="modal-description"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* =========================================================================
   CONFIGURATION — EDIT YOUR DESTINATIONS HERE
   =========================================================================

   Each destination has:
     name        – Label shown on hover and in the modal title
     lat, lng    – Coordinates (decimal degrees)
     images      – Array of image URLs for the gallery
     description – An HTML string shown in the modal body.
                   You can use <p>, <a>, <em>, <strong>, etc.
   ========================================================================= */

let DESTINATIONS = [];


/* =========================================================================
   GLOBE SETUP
   ========================================================================= */

const container = document.getElementById('canvas-container');
const hoverLabel = document.getElementById('hover-label');
const modalOverlay = document.getElementById('modal-overlay');
const modalTitle = document.getElementById('modal-title');
const modalGallery = document.getElementById('modal-gallery');
const modalDescription = document.getElementById('modal-description');
const modalClose = document.getElementById('modal-close');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.z = 3.2;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x0a0a0a, 1);
container.appendChild(renderer.domElement);

const globeGroup = new THREE.Group();
globeGroup.rotation.x = 0.5;
globeGroup.rotation.y = -0.1;
scene.add(globeGroup);

// Globe sphere with satellite imagery
const GLOBE_RADIUS = 1;
const SUN_RADIUS = 0.4;

const textureLoader = new THREE.TextureLoader();
const earthTexture = textureLoader.load('/static/img/world-topo-bathy-200407_5400x2700.jpg');

// Star background sphere (inside of a large sphere)
const starTexture = textureLoader.load('/static/img/starbox-8k.jpg');
const starSphere = new THREE.Mesh(
  new THREE.SphereGeometry(50, 64, 64),
  new THREE.MeshBasicMaterial({ map: starTexture, side: THREE.BackSide })
);
globeGroup.add(starSphere);

const globeSolid = new THREE.Mesh(
  new THREE.SphereGeometry(GLOBE_RADIUS, 64, 64),
  new THREE.MeshBasicMaterial({ map: earthTexture })
);
globeGroup.add(globeSolid);

const vertexShader = `
  varying vec3 vNormal;
  varying vec3 vViewDir;
  void main() {
    vNormal = normalize(normalMatrix * normal);
    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
    vViewDir = normalize(-mvPos.xyz);
    gl_Position = projectionMatrix * mvPos;
  }
`;

const fragmentShader = `
  uniform vec3 color;
  uniform float densityCenter;
  uniform float densityEdge;
  varying vec3 vNormal;
  varying vec3 vViewDir;
  void main() {
    float facing = dot(vNormal, vViewDir);           // 1 at center, 0 at edge
    float alpha = mix(densityEdge, densityCenter, facing);
    gl_FragColor = vec4(color, alpha);
  }
`;


const sun = new THREE.Mesh(
  new THREE.SphereGeometry(SUN_RADIUS, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
);
sun.position.set(20, 0, 0);
sun.userData.URL = "/"
globeGroup.add(sun);

const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(GLOBE_RADIUS * 1.015, 64, 64),
  new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: {
      color: { value: new THREE.Color(0x6b93d6)},
      densityCenter: { value: 0.10 },
      densityEdge:   { value: 0.6 },
    },
    vertexShader: vertexShader,
    fragmentShader: fragmentShader,
  })
);
globeGroup.add(atmosphere);

/* =========================================================================
   GEOJSON — LOAD CONTINENT OUTLINES
   =========================================================================
   DESTINATION MARKERS
   ========================================================================= */

function latLngToVec3(lat, lng, radius) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lng + 180) * (Math.PI / 180);
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
     radius * Math.cos(phi),
     radius * Math.sin(phi) * Math.sin(theta)
  );
}

const markerMeshes = [];
const markerScalables = []; // rings, dots, and hit spheres that should maintain screen size
const MARKER_RADIUS = 0.02;
const INITIAL_CAM_Z = camera.position.z;

function initializeGlobe() {
  DESTINATIONS.forEach((dest, i) => {
  const pos = latLngToVec3(dest.lat, dest.lng, GLOBE_RADIUS + 0.006);

  // Map marker for each location
  const box = new THREE.Mesh(
    new THREE.PlaneGeometry(MARKER_RADIUS, MARKER_RADIUS, 2, 2),
    new THREE.MeshBasicMaterial({ color: 0xe8e4df, transparent: true, opacity: 0.9, side: THREE.DoubleSide, wireframe: false})
  );
  box.position.copy(pos);
  box.lookAt(new THREE.Vector3(0, 0, 0));
  globeGroup.add(box);

  // Invisible hit-target sphere for raycasting
  const hitSphere = new THREE.Mesh(
    new THREE.SphereGeometry(MARKER_RADIUS * 1.5, 12, 12),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  hitSphere.position.copy(pos);
  hitSphere.userData = { destIndex: i };
  globeGroup.add(hitSphere);
  markerMeshes.push(hitSphere);

  markerScalables.push(box, hitSphere);
  });
}

/* =========================================================================
   INTERACTION — DRAG TO ROTATE, CLICK MARKERS
   ========================================================================= */

let isDragging = false;
let previousMouse = { x: 0, y: 0 };
let rotationVelocity = { x: 0, y: 0 };
let autoRotate = true;
const mouse = new THREE.Vector2();
const raycaster = new THREE.Raycaster();

renderer.domElement.addEventListener('pointerdown', e => {
  isDragging = true;
  autoRotate = false;
  previousMouse = { x: e.clientX, y: e.clientY };
  rotationVelocity = { x: 0, y: 0 };
});

renderer.domElement.addEventListener('pointermove', e => {
  // Hover detection
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(markerMeshes);

  const sunHover = raycaster.intersectObject(sun);
  if (hits.length > 0) {
    const dest = DESTINATIONS[hits[0].object.userData.destIndex];
    hoverLabel.innerHTML = dest.year ?
      `${dest.name} <span class="year">${dest.year}</span>`
      : `${dest.name}`;
    hoverLabel.style.left = e.clientX + 14 + 'px';
    hoverLabel.style.top = e.clientY - 14 + 'px';
    hoverLabel.classList.add('visible');
    renderer.domElement.style.cursor = 'pointer';
  } else if (sunHover.length > 0) {
    hoverLabel.classList.remove('visible');
    renderer.domElement.style.cursor = 'pointer';
  } else {
    hoverLabel.classList.remove('visible');
    renderer.domElement.style.cursor = isDragging ? 'grabbing' : 'grab';
  }

  if (!isDragging) return;
  const dx = e.clientX - previousMouse.x;
  const dy = e.clientY - previousMouse.y;
  rotationVelocity.x = dy * 0.003;
  rotationVelocity.y = dx * 0.003;
  globeGroup.rotation.x += rotationVelocity.x;
  globeGroup.rotation.y += rotationVelocity.y;
  previousMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('pointerup', () => { isDragging = false; });

// Scroll to zoom
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  camera.position.z = Math.max(1.8, Math.min(6, camera.position.z + e.deltaY * 0.002));
}, { passive: false });

// Click detection
renderer.domElement.addEventListener('click', e => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(markerMeshes);
  if (hits.length > 0) {
    openModal(DESTINATIONS[hits[0].object.userData.destIndex]);
    return;
  }
  const sunHits = raycaster.intersectObject(sun);
  if (sunHits.length > 0) {
    window.location.href = sun.userData.URL;
  }
});

/* =========================================================================
   MODAL
   ========================================================================= */

function openModal(dest) {
  modalTitle.innerHTML = dest.year ?
      `${dest.name} <span class="year">${dest.year}</span>`
      : `${dest.name}`;

  modalGallery.innerHTML = '';
  dest.images.forEach(src => {
    const img = document.createElement('img');
    img.src = src;
    img.alt = dest.name;
    img.loading = 'lazy';
    modalGallery.appendChild(img);
  });
  modalDescription.innerHTML = dest.description;
  modalOverlay.classList.add('open');
}

function closeModal() {
  modalOverlay.classList.remove('open');
}

modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => {
  if (e.target === modalOverlay) closeModal();
});
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

/* =========================================================================
   ANIMATION LOOP
   ========================================================================= */

function animate() {
  requestAnimationFrame(animate);

  if (!isDragging) {
    // Dampen velocity
    rotationVelocity.x *= 0.95;
    rotationVelocity.y *= 0.95;
    globeGroup.rotation.x += rotationVelocity.x;
    globeGroup.rotation.y += rotationVelocity.y;

    // Slow auto-rotation if no interaction
    if (autoRotate) {
      globeGroup.rotation.y += 0.00015;
    } else if (Math.abs(rotationVelocity.x) < 0.0001 && Math.abs(rotationVelocity.y) < 0.0001) {
      autoRotate = true;
    }
  }

  // Scale markers to maintain constant screen size
  const s = camera.position.z / INITIAL_CAM_Z;
  markerScalables.forEach(m => m.scale.setScalar(s));

  renderer.render(scene, camera);
}

animate();

/* =========================================================================
   RESIZE
   ========================================================================= */

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================================
   LOAD DESTINATIONS AND INITIALIZE
   ========================================================================= */

fetch('./destinations.json')
  .then(r => r.json())
  .then(data => {
    DESTINATIONS = data;
    initializeGlobe();
  })
  .catch(err => console.error("Could not load destinations:", err));
</script>
</body>
</html>
